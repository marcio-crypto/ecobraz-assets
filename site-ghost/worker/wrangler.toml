name = "ecobraz-coletas"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
account_id = "0ab0573840927669f3bb3666d63cc023"

# IMPORTANTE: preserva TODAS as variáveis e segredos já configurados na
# Cloudflare (Ploomes, E-goi, Turnstile, ALLOWED_ORIGINS...). O deploy só
# atualiza o CÓDIGO — não apaga nenhuma configuração existente.
keep_vars = true

# Cofre de leads (KV): toda solicitação recebida é gravada aqui ANTES de ir ao
# CRM. Se o Ploomes estiver fora do ar, o lead fica preservado no cofre e o
# visitante recebe confirmação normal — nenhum lead se perde.
[[kv_namespaces]]
binding = "LEADS_COFRE"
id = "5b56276238f8492fb78d7a4d7d215f85"

# Segredos usados pelo Worker (definidos na Cloudflare, nunca no repositório):
#   PLOOMES_USER_KEY, PLOOMES_PIPELINE_ID, PLOOMES_STAGE_ID, PLOOMES_OWNER_ID
#   EGOI_API_KEY, EGOI_LIST_ID
#   TURNSTILE_SECRET_KEY, ALLOWED_ORIGINS
# Para o e-mail de confirmação ao lead:
#   EGOI_TRANSACTIONAL_API_KEY  -> chave da API Transacional (se ausente, o
#                                  Worker tenta a EGOI_API_KEY já existente).
#   EGOI_SENDER_ID              -> OPCIONAL: se ausente, o Worker descobre o
#                                  remetente automaticamente (lista os senders
#                                  da conta e usa o primeiro).
# Opcionais: EGOI_SENDER_NAME, EGOI_REPLY_TO_ID, EGOI_TRANSACTIONAL_API_URL
