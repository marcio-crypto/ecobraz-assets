name: Deploy Ghost staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ghost.yml'
      - 'site-ghost/theme/**'
      - 'site-ghost/scripts/deploy-theme.mjs'
      - 'site-ghost/scripts/deploy-redirects.mjs'
      - 'site-ghost/scripts/sync-pages.mjs'
      - 'site-ghost/scripts/sync-posts.mjs'
      - 'site-ghost/scripts/audit-content.mjs'
      - 'site-ghost/scripts/cleanup-staging.mjs'
      - 'site-ghost/content/**'
      - 'site-ghost/theme/redirects.yaml'
      - 'site-ghost/migration/**'

permissions:
  contents: read

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit content, links and collection form
        run: node site-ghost/scripts/audit-content.mjs
      - name: Build Ghost theme ZIP
        working-directory: site-ghost/theme
        run: zip -r ../ecobraz-conversion.zip . -x '.DS_Store' '*.git*'
      - name: Upload theme to Ghost staging
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/deploy-theme.mjs site-ghost/ecobraz-conversion.zip
      - name: Sync priority commercial pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/pages.json
      - name: Sync material landing pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/material-pages.json
      - name: Sync high-intent search landing pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/search-intent-pages.json
      - name: Sync institutional conversion pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/institutional-pages.json
      - name: Sync priority authority articles
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-posts.mjs site-ghost/content/priority-posts.json
      - name: Remove duplicate and starter content from indexing
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/cleanup-staging.mjs
      - name: Validate backlink redirect package
        shell: bash
        run: |
          test -s site-ghost/theme/redirects.yaml
          RULES="$(grep -Ec '^  ' site-ghost/theme/redirects.yaml)"
          test "$RULES" -ge 7900
          echo "Pacote validado com $RULES redirecionamentos."
      - name: Install and verify backlink redirects
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/deploy-redirects.mjs site-ghost/theme/redirects.yaml
      - name: Preserve backlink redirects for owner import
        uses: actions/upload-artifact@v4
        with:
          name: ecobraz-backlink-redirects-OWNER-IMPORT
          path: site-ghost/theme/redirects.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Audit live priority redirects (traffic map)
        run: node site-ghost/scripts/audit-live-redirects.mjs https://ecobraz-emigre.ghost.io site-ghost/migration/redirect-map.csv 100
      - name: Audit live redirects sample (installed package)
        run: node site-ghost/scripts/audit-live-redirects.mjs https://ecobraz-emigre.ghost.io site-ghost/theme/redirects.yaml 250
