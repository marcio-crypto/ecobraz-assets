name: Deploy Ghost staging

on:
  workflow_dispatch:
    inputs:
      test_integrations:
        description: 'Enviar lead de teste real para Ploomes/E-goi'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ghost.yml'
      - 'site-ghost/theme/**'
      - 'site-ghost/scripts/**'
      - 'site-ghost/content/**'
      - 'site-ghost/landing/**'
      - 'site-ghost/scripts/build-landing-pages.mjs'
      - 'site-ghost/theme/redirects.yaml'
      - 'site-ghost/migration/**'

permissions:
  contents: read

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build commercial landing pages from data
        run: node site-ghost/scripts/build-landing-pages.mjs
      - name: Build English commercial landing pages from data
        if: ${{ hashFiles('site-ghost/landing/landing-pages-en.json') != '' }}
        run: node site-ghost/scripts/build-landing-pages-en.mjs
      - name: Build internal signature page from the signature file
        run: node site-ghost/scripts/build-pagina-assinatura.mjs
      - name: Audit content, links and collection form
        run: node site-ghost/scripts/audit-content.mjs
      - name: Build Ghost theme ZIP
        working-directory: site-ghost/theme
        run: zip -r ../ecobraz-conversion.zip . -x '.DS_Store' '*.git*'
      - name: Upload theme to Ghost staging
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/deploy-theme.mjs site-ghost/ecobraz-conversion.zip
      - name: Sync Ghost settings (descrição e tag do Google)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-settings.mjs
      - name: Sync meta descriptions das tags (arquivos de tag)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-tags-meta.mjs
      - name: Sync priority commercial pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/pages.json
      - name: Sync material landing pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/material-pages.json
      - name: Sync high-intent search landing pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/search-intent-pages.json
      - name: Sync institutional conversion pages
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/institutional-pages.json
      - name: Sync internal pages (assinaturas de e-mail da equipe)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/paginas-internas.json
      - name: Sync English overview page (/en/)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/en-hub-page.json
      - name: Sync English pages (versão EN do site)
        if: ${{ hashFiles('site-ghost/content/en-paginas.json') != '' }}
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/en-paginas.json
      - name: Sync English commercial landing pages (templates ricos)
        if: ${{ hashFiles('site-ghost/content/en-commercial-pages.json') != '' }}
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/en-commercial-pages.json
      - name: Sync English posts (versão EN do blog)
        if: ${{ hashFiles('site-ghost/content/en-posts.json') != '' }}
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-posts.mjs site-ghost/content/en-posts.json
      - name: Sync commercial landing pages (arquitetura de conversão)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/commercial-pages.json
      - name: Sync priority authority articles
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-posts.mjs site-ghost/content/priority-posts.json
      - name: Sync migrated editorial posts (migração ecobrazinforma)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-posts.mjs site-ghost/content/migrated-posts.json
      - name: Sync author pages (colunistas)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-pages.mjs site-ghost/content/autor-pages.json
      - name: Reaplica hreflang bilíngue (o sync sobrescreve o codeinjection_head)
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/aplica-hreflang.mjs
      - name: Instala o gerador de capas dos posts
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @napi-rs/canvas >/dev/null
      - name: Gera e aplica capas ilustradas nos posts
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-post-covers.mjs site-ghost/content/priority-posts.json
      - name: Gera e aplica capas ilustradas nos posts migrados
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/sync-post-covers.mjs site-ghost/content/migrated-posts.json
      - name: Remove duplicate and starter content from indexing
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/cleanup-staging.mjs
      - name: Validate backlink redirect package
        shell: bash
        run: |
          test -s site-ghost/theme/redirects.yaml
          RULES="$(grep -Ec '^  ' site-ghost/theme/redirects.yaml)"
          test "$RULES" -ge 7900
          echo "Pacote validado com $RULES redirecionamentos."
      - name: Install and verify backlink redirects
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/deploy-redirects.mjs site-ghost/theme/redirects.yaml
      - name: Preserve backlink redirects for owner import
        uses: actions/upload-artifact@v4
        with:
          name: ecobraz-backlink-redirects-OWNER-IMPORT
          path: site-ghost/theme/redirects.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Audit live priority redirects (traffic map)
        run: node site-ghost/scripts/audit-live-redirects.mjs https://ecobraz.org site-ghost/migration/redirect-map.csv 100
      - name: Audit live redirects sample (installed package)
        run: node site-ghost/scripts/audit-live-redirects.mjs https://ecobraz.org site-ghost/theme/redirects.yaml 250
      - name: Audit live site (pages, links, SEO wiring)
        run: node site-ghost/scripts/audit-live-site.mjs https://ecobraz.org
      - name: Notifica o Bing via IndexNow (URLs do sitemap)
        run: node site-ghost/scripts/submit-indexnow.mjs https://ecobraz.org
      - name: Test Ploomes/E-goi integrations with a labelled lead
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_integrations }}
        run: node site-ghost/scripts/test-collection-endpoint.mjs https://ecobraz-coletas.ti-0ab.workers.dev https://ecobraz.org
