name: Portal — Diagnóstico E-goi (consulta o Worker)

# (1) Consulta o endpoint temporário /_diag/egoi do Worker (resposta crua do E-goi).
# (2) Baixa a especificação da API transacional v2 do E-goi para achar o endpoint
#     e o payload corretos de envio de e-mail. Não expõe segredos.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecobraz-carbon-tracking-system-dh28dx
    paths:
      - '.github/workflows/portal-diag-egoi.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar /_diag/egoi do Worker
        run: |
          echo "== Resposta do endpoint de diagnostico =="
          curl -sS -m 30 "https://ecobraz-portal.ti-0ab.workers.dev/_diag/egoi/dz7m2x9q4p1v8" || echo "curl falhou"
          echo
          echo "== fim =="
      - name: Achar a spec real (springdoc no servidor da API)
        run: |
          set +e
          for U in \
            "https://slingshot.egoiapp.com/api/v3/api-docs" \
            "https://slingshot.egoiapp.com/api/v2/api-docs" \
            "https://slingshot.egoiapp.com/v3/api-docs" \
            "https://slingshot.egoiapp.com/v2/api-docs" \
            "https://slingshot.egoiapp.com/api/api-docs" \
            "https://slingshot.egoiapp.com/api/swagger.json" \
            "https://slingshot.egoiapp.com/api/openapi.json" ; do
            code=$(curl -sS -m 15 -o /tmp/s.json -w '%{http_code}' "$U")
            valid=no; head -c 1 /tmp/s.json 2>/dev/null | grep -q '{' && valid=yes
            echo "[$code valid_json:$valid] $U"
            if [ "$valid" = yes ]; then
              echo "TITLE: $(jq -r '.info.title // "?"' /tmp/s.json 2>/dev/null)"
              echo "--- paths com 'email' ---"
              jq -r '.paths | keys[]' /tmp/s.json 2>/dev/null | grep -i email | head -50
              echo "--- para cada path de email: métodos ---"
              jq -r '.paths | to_entries[] | select(.key|test("email";"i")) | "\(.key) -> \(.value|keys|join(","))"' /tmp/s.json 2>/dev/null | head -40
              echo "--- requestBody schema do POST em .../messages ---"
              jq '.paths | to_entries[] | select(.key|test("email/messages$";"i")) | .value.post.requestBody' /tmp/s.json 2>/dev/null | head -80
              echo "--- schema EmailMessage/Message (componentes) ---"
              jq '.components.schemas | to_entries[] | select(.key|test("email|message";"i")) | .key' /tmp/s.json 2>/dev/null | head -30
              cp /tmp/s.json /tmp/spec_ok.json
              break
            fi
          done
          echo "== fim spec =="
