name: Villanova ESG — reativar tema (limpa cache do robots.txt)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reativar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Casper por um instante e volta ao institucional
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/reativa-tema.mjs
