name: Relatório do sitemap ao vivo

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site a inspecionar'
        type: string
        default: 'https://ecobraz.org'
      check_paths:
        description: 'Caminhos extras para checar status/redirect (separados por espaço)'
        type: string
        default: ''
      html_meta:
        description: 'URL para inspecionar favicon e metas sociais (vazio = pular)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar sitemap e contar páginas
        run: |
          BASE="${{ inputs.base_url }}"
          echo "== Índice: $BASE/sitemap.xml =="
          curl -sSf "$BASE/sitemap.xml" -o index.xml
          grep -o '<loc>[^<]*</loc>' index.xml | sed 's/<[^>]*>//g' > children.txt
          cat children.txt
          TOTAL=0
          echo
          while read -r child; do
            curl -sSf "$child" -o child.xml
            COUNT=$(grep -o '<loc>[^<]*</loc>' child.xml | grep -vc '\.\(png\|jpg\|jpeg\|webp\|gif\|svg\)$' || true)
            TOTAL=$((TOTAL + COUNT))
            echo "== $child: $COUNT URLs =="
            grep -o '<loc>[^<]*</loc>' child.xml | sed 's/<[^>]*>//g' | grep -v '\.\(png\|jpg\|jpeg\|webp\|gif\|svg\)$' || true
            echo
          done < children.txt
          echo "TOTAL DE URLS NO SITEMAP: $TOTAL"
      - name: Checar status e redirects de caminhos extras
        if: ${{ inputs.check_paths != '' }}
        run: |
          BASE="${{ inputs.base_url }}"
          for p in ${{ inputs.check_paths }}; do
            echo "== $BASE$p =="
            curl -s -o /dev/null -w "  status=%{http_code} location=%{redirect_url}\n" "$BASE$p"
            curl -s -o /dev/null -L -w "  final=%{url_effective} status=%{http_code}\n" "$BASE$p"
          done
      - name: Inspecionar favicon e metadados sociais
        if: ${{ inputs.html_meta != '' }}
        run: |
          curl -s "${{ inputs.html_meta }}" -o pagina.html
          echo "== link rel=icon =="
          grep -o '<link[^>]*rel="[^"]*icon[^"]*"[^>]*>' pagina.html || echo "(nenhum)"
          echo "== metas og/twitter =="
          grep -o '<meta[^>]*\(og:image\|og:title\|og:description\|twitter:image\|twitter:card\)[^>]*>' pagina.html || echo "(nenhuma)"
          echo "== title =="
          grep -o '<title>[^<]*</title>' pagina.html | head -1
          echo "== hreflang =="
          grep -o '<link[^>]*hreflang[^>]*>' pagina.html || echo "(nenhum)"
          echo "== consent mode v2 (default negado) =="
          grep -o "gtag('consent', *'default'" pagina.html || echo "(ausente)"
          echo "== script do banner de consentimento =="
          grep -o '<script[^>]*consent\.js[^>]*>' pagina.html || echo "(ausente)"
          echo "== chave de idioma PT =="
          grep -o '<a class="lang-switch"[^>]*>' pagina.html || echo "(ausente)"
