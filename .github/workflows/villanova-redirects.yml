name: Villanova ESG — enviar redirects

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Caminho do YAML de redirects'
        required: false
        type: string
        default: 'site-villanova/redirects-villanova.yaml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup do atual, upload e verificação ao vivo
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/upload-redirects.mjs "${{ inputs.arquivo }}"
