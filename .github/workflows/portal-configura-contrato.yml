name: Portal — Criar marcação de contrato no Ploomes

# Cria os 2 campos de contrato no cadastro de empresa do Ploomes.
# Segurança: o passo abaixo define APLICAR. Com APLICAR="0" é SIMULAÇÃO (só leitura);
# com APLICAR="1" cria de fato. Idempotente (não duplica campos já existentes).

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Digite 1 para CRIAR de fato (vazio/0 = simulação)'
        default: '0'
  # Gatilho temporário nesta branch (workflow_dispatch só fica disponível após
  # o arquivo estar na branch principal). Pode ser removido depois.
  push:
    branches:
      - claude/ecobraz-carbon-tracking-system-dh28dx
    paths:
      - '.github/workflows/portal-configura-contrato.yml'
      - 'portal-cliente/configuracao/**'

permissions:
  contents: read

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar (simulação por padrão)
        env:
          PLOOMES_USER_KEY: ${{ secrets.PLOOMES_USER_KEY }}
          PLOOMES_API_URL: ${{ secrets.PLOOMES_API_URL }}
          # No push é sempre simulação; no dispatch, respeita o input "aplicar".
          APLICAR: ${{ github.event.inputs.aplicar == '1' && '1' || '0' }}
        run: node portal-cliente/configuracao/configura-contrato.mjs
