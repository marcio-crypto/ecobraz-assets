name: Ferramenta — apagar lead do cofre KV (Villanova)

# Apaga chaves específicas do cofre de leads. Feita para remover os leads de
# TESTE sem tocar em lead real.
#
# ESCOLHA O COFRE. Há dois, e confundir os dois faz procurar no lugar errado:
#
#   villanova -> KV de leads do villanovaesg.com
#   ecobraz   -> KV "ecobraz-leads-cofre", onde o Worker ecobraz-coletas grava
#                TODO lead antes de mandar ao portal
#
# Os leads "TESTE AUTOMATIZADO <carimbo>" nascem dos scripts do site da Ecobraz
# (test-collection-endpoint.mjs, e2e-click-test.mjs, auditoria-ecobraz.mjs) e
# portanto vivem no cofre ECOBRAZ, no portal (sistema.ecobraz.org) e, havendo
# consentimento, na lista do E-goi.
#
# NÃO estão no Ploomes: ele foi desativado em 30/07/2026 e o destino passou a
# ser o sistema próprio. A função sendToPloomes segue no Worker apenas como
# rede de emergência, sem ser chamada.
#
# Esta ferramenta alcança só o KV. O portal e o E-goi são fora do alcance dela.
#
# Três modos:
#   listar   -> imprime só os NOMES das chaves (nunca o conteúdo)
#   procurar -> imprime só os NOMES das chaves cujo valor contém o termo
#   apagar   -> apaga as chaves indicadas em "chaves"
#
# Trava de segurança: no modo apagar, cada chave só é removida se o valor dela
# contiver o texto de "exige_conter" (por padrão "TESTE AUTOMATIZADO"). Se não
# contiver, a chave é PULADA e o log diz por quê. Assim um nome digitado errado
# não apaga um lead de verdade. Para apagar algo que não é teste, é preciso
# esvaziar "exige_conter" de propósito.
#
# Privacidade: este repositório é público e o log do Actions também é. Nenhum
# modo aqui imprime o conteúdo de um lead — só nomes de chave e contagens.

on:
  workflow_dispatch:
    inputs:
      cofre:
        description: 'Qual cofre: villanova ou ecobraz'
        type: choice
        options: [villanova, ecobraz]
        default: ecobraz
      modo:
        description: 'listar | procurar | apagar'
        type: choice
        options: [listar, procurar, apagar]
        default: listar
      termo:
        description: 'modo procurar: texto a achar dentro do valor'
        required: false
        default: 'TESTE AUTOMATIZADO'
      chaves:
        description: 'modo apagar: nomes das chaves separados por espaço'
        required: false
        default: ''
      exige_conter:
        description: 'modo apagar: só apaga se o valor contiver isto (vazio = sem trava)'
        required: false
        default: 'TESTE AUTOMATIZADO'

permissions:
  contents: read

jobs:
  operar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NS_VILLANOVA: dbcea79a0fee420d873c313a7a2acf50
      NS_ECOBRAZ: 5b56276238f8492fb78d7a4d7d215f85
      COFRE: ${{ inputs.cofre }}
      MODO: ${{ inputs.modo }}
      TERMO: ${{ inputs.termo }}
      CHAVES: ${{ inputs.chaves }}
      EXIGE: ${{ inputs.exige_conter }}
    steps:
      - name: Listar, procurar ou apagar
        run: |
          set -euo pipefail
          if [ "$COFRE" = "villanova" ]; then NS="$NS_VILLANOVA"; else NS="$NS_ECOBRAZ"; fi
          export NS
          echo "Cofre: $COFRE"
          npx wrangler@latest kv key list --namespace-id="$NS" --remote > /tmp/chaves.json
          python3 - <<'EOF'
          import json, os, subprocess, sys

          NS = os.environ['NS']
          modo = os.environ['MODO']
          termo = os.environ.get('TERMO', '')
          exige = os.environ.get('EXIGE', '')
          chaves_pedidas = os.environ.get('CHAVES', '').split()

          todas = sorted((k['name'] for k in json.load(open('/tmp/chaves.json'))), reverse=True)
          print(f'Total de chaves no cofre: {len(todas)}')
          if not todas:
              sys.exit('O cofre voltou VAZIO. Quase sempre isso quer dizer que o wrangler leu o\n'
                       'armazenamento local em vez do namespace de verdade (o wrangler 4 exige\n'
                       '--remote nos comandos de KV), e nao que nao ha lead. Nao trate como cofre vazio.')

          def ler(nome):
              r = subprocess.run(
                  ['npx', 'wrangler@latest', 'kv', 'key', 'get', nome, '--namespace-id', NS, '--remote'],
                  capture_output=True, text=True)
              return r.stdout

          if modo == 'listar':
              for n in todas:
                  print(n)
              sys.exit(0)

          if modo == 'procurar':
              achou = [n for n in todas if termo and termo in ler(n)]
              print(f'\nChaves cujo valor contém {termo!r}: {len(achou)}')
              for n in achou:
                  print(n)
              sys.exit(0)

          # modo apagar
          if not chaves_pedidas:
              sys.exit('Nada a fazer: "chaves" está vazio.')

          apagadas, puladas = [], []
          for n in chaves_pedidas:
              if n not in todas:
                  puladas.append((n, 'chave não existe no cofre'))
                  continue
              if exige and exige not in ler(n):
                  puladas.append((n, f'valor não contém {exige!r} — trava de segurança'))
                  continue
              r = subprocess.run(
                  ['npx', 'wrangler@latest', 'kv', 'key', 'delete', n, '--namespace-id', NS, '--remote', '--force'],
                  capture_output=True, text=True)
              if r.returncode == 0:
                  apagadas.append(n)
              else:
                  puladas.append((n, 'falha do wrangler: ' + (r.stderr or r.stdout).strip()[:200]))

          print(f'\nApagadas: {len(apagadas)}')
          for n in apagadas:
              print('  -', n)
          print(f'Puladas: {len(puladas)}')
          for n, motivo in puladas:
              print('  -', n, '->', motivo)
          if puladas and not apagadas:
              sys.exit(1)
          EOF
