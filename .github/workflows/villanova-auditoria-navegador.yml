name: Villanova — auditoria no navegador de verdade

# Abre o site publicado num Chromium real e anota tudo que quebra: erro de
# JavaScript, requisição falhada, rolagem horizontal no celular, imagem que não
# carrega, link interno quebrado e o que parece botão sem ser.
#
# Existe porque uma gravação do Microsoft Clarity não pode ser aberta por fora
# da conta, e porque olhar só o código-fonte já me fez errar antes: o que vale é
# o que o navegador faz com a página SERVIDA.
#
# Também roda a "jornada": o desvio automático de idioma e o banner de cookies,
# que são os dois primeiros segundos de qualquer visita.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço (vazio = amostra do sitemap)'
        type: string
        default: ''
      limite:
        description: 'Quantas páginas na amostra (232 = site inteiro)'
        type: string
        default: '24'
      fatias:
        description: 'Em quantas rodadas paralelas dividir (4 = varredura completa em ~1/4 do tempo)'
        type: choice
        options: ['1', '2', '4', '6']
        default: '1'
      jornada:
        description: 'Rodar também o teste de jornada (idioma + cookies)'
        type: boolean
        default: true
      banner:
        description: 'Rodar o diagnóstico do banner de cookies no celular'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A matriz existe para a varredura COMPLETA caber no tempo: 232 URLs x 5 telas
  # passa de uma hora numa rodada só. Com fatias=4 cada job pega um quarto das
  # URLs (por resto de divisão, então cada fatia mistura página institucional e
  # post) e o conjunto termina em ~1/4 do tempo. Com fatias=1 nada muda.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      fatias: ${{ steps.montar.outputs.fatias }}
    steps:
      - id: montar
        env:
          N: ${{ inputs.fatias }}
        run: |
          n="${N:-1}"
          lista=$(seq 0 $((n - 1)) | paste -sd, -)
          echo "fatias=[$lista]" >> "$GITHUB_OUTPUT"
          echo "vai rodar as fatias [$lista]"

  auditar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        fatia: ${{ fromJSON(needs.preparar.outputs.fatias) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar o Playwright e o Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Auditar as páginas
        env:
          LIMITE_PAGINAS: ${{ inputs.limite }}
          FATIAS: ${{ inputs.fatias }}
          FATIA: ${{ matrix.fatia }}
        run: node site-villanova/scripts/auditoria-navegador.mjs ${{ inputs.urls }}

      - name: Jornada de entrada (idioma + consentimento)
        if: ${{ inputs.jornada && matrix.fatia == 0 }}
        run: node site-villanova/scripts/auditoria-jornada.mjs

      - name: Diagnóstico do banner no celular
        if: ${{ inputs.banner && matrix.fatia == 0 }}
        run: node site-villanova/scripts/diag-banner-celular.mjs

      - name: Guardar as telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-fatia-${{ matrix.fatia }}
          path: auditoria-navegador/
          retention-days: 14

      # Por ultimo de proposito: o passo de upload despeja dezenas de linhas de
      # "Uploaded bytes", e o resumo ficava enterrado no meio do log.
      - name: Resumo desta fatia
        if: always()
        run: cat auditoria-navegador/RESUMO.txt || echo "sem RESUMO.txt"
