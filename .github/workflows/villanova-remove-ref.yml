name: Villanova ESG — tirar o ?ref= dos links externos

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular (só relatório) ou aplicar (grava no Ghost)'
        type: choice
        options:
          - simular
          - aplicar
        default: simular

permissions:
  contents: read

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover ref=villanovaesg.com de dentro dos href
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/remove-ref-externo.mjs "${{ inputs.modo }}"
