name: Inventário ecobrazinforma (migração)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Inventaria o ecobrazinforma.org via Wayback Machine
        run: node migracao-informa/scripts/inventario.mjs
      - name: Publica o inventário no repositório
        run: |
          git config user.name "ecobraz-bot"
          git config user.email "ti@ecobraz.org"
          git add migracao-informa/inventario.json
          git diff --cached --quiet && echo "Sem mudanças." && exit 0
          git commit -m "Inventário ecobrazinforma (varredura automatizada)"
          git pull --rebase origin main
          git push origin HEAD:main
