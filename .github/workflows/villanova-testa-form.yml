name: Villanova ESG — testar formulário de contato (E2E)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Preenche e envia o formulário ao vivo
        run: node site-villanova/scripts/testa-formulario.mjs https://www.villanovaesg.com
      - name: Guarda o print
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-villanova-screenshot
          path: shots/
          if-no-files-found: warn
          retention-days: 14
