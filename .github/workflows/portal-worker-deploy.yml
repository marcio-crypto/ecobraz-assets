name: Ecobraz — publicar Worker do Portal

# Publica o Worker ecobraz-portal (login + portão de contrato + painel).
# Requer os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no GitHub
# (os mesmos já usados para publicar o Worker de coletas).
#
# Enquanto o Portal está em desenvolvimento, também publica ao dar push nesta
# branch (endereço de teste workers.dev). Para produção, remover o gatilho de
# push e publicar só manualmente (workflow_dispatch, após merge na main).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecobraz-carbon-tracking-system-dh28dx
    paths:
      - 'portal-cliente/worker/**'
      - '.github/workflows/portal-worker-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-cliente/worker
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      # A chave do Mercado Pago mora no GitHub (Settings → Secrets → Actions →
      # MERCADOPAGO_ACCESS_TOKEN) e entra na Cloudflare NO PRÓPRIO DEPLOY, via
      # --var. Por quê: na Cloudflare ela já existe como VARIÁVEL comum (não
      # Secret) — "wrangler secret put" conflita (erro 10053: binding em uso).
      # O --var atualiza o valor no mesmo formato; keep_vars preserva as demais
      # chaves; o GitHub mascara o valor no log (aparece como ***). Sem a chave
      # no GitHub, o deploy roda normal e mantém o valor atual.
      - name: Publicar Worker (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MP_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          if [ -n "$MP_TOKEN" ]; then
            npx wrangler@latest deploy --var MERCADOPAGO_ACCESS_TOKEN:"$MP_TOKEN"
            echo "Chave do Mercado Pago atualizada junto com o deploy."
          else
            npx wrangler@latest deploy
          fi
