name: Ecobraz — publicar Worker do Portal

# Publica o Worker ecobraz-portal (login + portão de contrato + painel).
# Requer os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no GitHub
# (os mesmos já usados para publicar o Worker de coletas).
#
# Enquanto o Portal está em desenvolvimento, também publica ao dar push nesta
# branch (endereço de teste workers.dev). Para produção, remover o gatilho de
# push e publicar só manualmente (workflow_dispatch, após merge na main).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecobraz-carbon-tracking-system-dh28dx
    paths:
      - 'portal-cliente/worker/**'
      - '.github/workflows/portal-worker-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-cliente/worker
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      # O painel da Cloudflare trava a edição manual de segredos em Workers
      # publicados por esteira. Solução: o segredo mora no GitHub (Settings →
      # Secrets → Actions → MERCADOPAGO_ACCESS_TOKEN) e cada publicação leva o
      # valor até a Cloudflare. Se o segredo não existir no GitHub, nada muda
      # (mantém o que já está na Cloudflare). O valor nunca aparece no log.
      - name: Sincronizar segredo do Mercado Pago (GitHub → Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MP_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          if [ -n "$MP_TOKEN" ]; then
            printf '%s' "$MP_TOKEN" | npx wrangler@latest secret put MERCADOPAGO_ACCESS_TOKEN
            echo "Segredo do Mercado Pago sincronizado."
          else
            echo "MERCADOPAGO_ACCESS_TOKEN não está no GitHub — mantendo o valor atual da Cloudflare."
          fi
      - name: Publicar Worker (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
