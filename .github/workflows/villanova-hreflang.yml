name: Villanova ESG — aplicar hreflang nos pares de idioma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hreflang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar hreflang via codeinjection
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/aplica-hreflang.mjs
