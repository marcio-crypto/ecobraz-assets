name: Inventário do site Villanova ESG

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site a inventariar'
        type: string
        default: 'https://www.villanovaesg.com'

permissions:
  contents: read

jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Varrer sitemap e coletar metadados por página
        run: node site-villanova/scripts/inventario-site.mjs "${{ inputs.base_url }}"
      - name: Guardar o inventário completo
        uses: actions/upload-artifact@v4
        with:
          name: villanova-inventario
          path: villanova-inventario.json
          retention-days: 30
