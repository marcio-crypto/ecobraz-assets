name: Villanova ESG — aplicar marca (ícone e imagens sociais)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar escudo e cartão social e definir nas configurações
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/aplicar-marca.mjs
