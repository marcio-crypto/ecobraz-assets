name: Ecobraz — remover Sérgio Diniz como autor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remover-autor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reatribuir posts e remover o autor
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/remove-autor-sergio.mjs
