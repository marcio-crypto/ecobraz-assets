name: Portal — montagem do pacote (temporário, NÃO publica)

# TEMPORÁRIO (21/11/2026): confere que o Worker do Portal monta inteiro
# (wrangler deploy --dry-run) com a mudança da leitura em lote da doca.
# Sem nenhuma chave da Cloudflare: não tem como publicar nada.
# Sai do repositório logo depois da conferência.

on:
  push:
    branches:
      - claude/awesome-newton-mq0qmo

permissions:
  contents: read

jobs:
  montagem:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-cliente/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Montar o pacote sem publicar
        run: |
          npx --yes wrangler@latest deploy --dry-run --outdir /tmp/pacote
          echo "MONTAGEM OK: $(ls /tmp/pacote | wc -l) arquivo(s) no pacote"
