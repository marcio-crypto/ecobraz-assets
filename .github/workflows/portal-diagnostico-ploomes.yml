name: Portal — Diagnóstico do Ploomes (somente leitura)

# Rodada manual e SOMENTE-LEITURA. Descobre a estrutura real do Ploomes
# (funis, etapas, campos, contagens) para construirmos o Portal do Cliente sem
# suposições. NÃO cria, altera ou apaga nada, e NÃO baixa dados pessoais.
#
# PRÉ-REQUISITO: o segredo PLOOMES_USER_KEY precisa existir em
#   Settings > Secrets and variables > Actions
# (é a mesma chave de API do Ploomes já usada pelo Worker; basta copiá-la para cá).

on:
  workflow_dispatch:
    inputs:
      cnpj:
        description: 'CNPJ de um cliente-exemplo para inspeção focada (vazio = diagnóstico geral)'
        required: false
        default: ''
      sonda:
        description: 'Sonda específica: "upload" (só lê o $metadata) ou "upload-live" (testa o upload criando e apagando um negócio de teste). Vazio = ignora.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnóstico geral (somente leitura) — quando SEM cnpj e SEM sonda
        if: ${{ github.event.inputs.cnpj == '' && github.event.inputs.sonda == '' }}
        env:
          PLOOMES_USER_KEY: ${{ secrets.PLOOMES_USER_KEY }}
          PLOOMES_API_URL: ${{ secrets.PLOOMES_API_URL }} # opcional; padrão public-api2.ploomes.com
        run: node portal-cliente/diagnostico/diagnostico-ploomes.mjs
      - name: Sonda de upload (Abrir OS) — quando sonda = upload / upload-live
        if: ${{ github.event.inputs.sonda == 'upload' || github.event.inputs.sonda == 'upload-live' }}
        env:
          PLOOMES_USER_KEY: ${{ secrets.PLOOMES_USER_KEY }}
          PLOOMES_API_URL: ${{ secrets.PLOOMES_API_URL }}
          LIVE: ${{ github.event.inputs.sonda == 'upload-live' && '1' || '0' }}
        run: node portal-cliente/diagnostico/sonda-upload.mjs
      - name: Inspeção de cliente-exemplo (somente leitura) — quando informado cnpj
        if: ${{ github.event.inputs.cnpj != '' }}
        env:
          PLOOMES_USER_KEY: ${{ secrets.PLOOMES_USER_KEY }}
          PLOOMES_API_URL: ${{ secrets.PLOOMES_API_URL }}
          CNPJ_ALVO: ${{ github.event.inputs.cnpj }}
        run: node portal-cliente/diagnostico/inspeciona-cliente.mjs
      - name: Guardar resultado como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-ploomes
          path: portal-cliente/diagnostico/resultado-ploomes.json
          if-no-files-found: warn
