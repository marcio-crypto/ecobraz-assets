name: Ecobraz — aplicar hreflang nos pares de idioma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hreflang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar hreflang via codeinjection
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/aplica-hreflang.mjs
