name: Ecobraz — auditoria de indexação (BR + Europa)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base do site'
        required: false
        default: 'https://ecobraz.org'

permissions:
  contents: read

jobs:
  indexacao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Auditoria de indexabilidade e hreflang
        run: node site-ghost/scripts/auditoria-indexacao.mjs '${{ inputs.base_url }}'
      # Diagnóstico dirigido aos avisos do Search Console de 15/10/2026.
      # Roda sempre, mesmo se a auditoria acima falhar, porque é o que localiza
      # as URLs de cada motivo (5xx, 404, redirect, canônica).
      - name: Diagnóstico Search Console (5xx, 404, redirects, canônicas)
        if: always()
        env:
          LIMITE_SITEMAP: '600'
        run: node site-ghost/scripts/diagnostico-search-console.mjs '${{ inputs.base_url }}'
      # Caça o 5xx que o Search Console relatou e que a varredura do sitemap
      # não reproduziu: amostra as URLs legadas do redirects.yaml, que é o
      # conjunto que o Googlebot realmente bate via links externos.
      - name: Caça 5xx nas URLs legadas (fora do sitemap)
        if: always()
        env:
          AMOSTRA: '400'
          CONCORRENCIA: '5'
          PAUSA_MS: '150'
        run: node site-ghost/scripts/caca-5xx-legadas.mjs '${{ inputs.base_url }}'
