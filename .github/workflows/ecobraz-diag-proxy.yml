name: Ecobraz — diagnóstico de proxy/tag gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnóstico de proxy e reescrita da tag
        run: node site-ghost/scripts/diag-proxy-gtag.mjs https://ecobraz.org
