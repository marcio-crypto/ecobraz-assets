name: Villanova ESG — Fase 1 (diagnóstico de indexação)

on:
  workflow_dispatch:
    inputs:
      corrigir:
        description: 'Aplicar a correção das canônicas (true) ou só diagnosticar'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostico:
    if: ${{ !inputs.corrigir }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sitemap vs publicado, robots.txt e redirecionamentos do raiz
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/fase1-diagnostico.mjs

  corrigir-canonicas:
    if: ${{ inputs.corrigir }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover canônicas autorreferentes e recontar o sitemap
        env:
          VILLANOVA_GHOST_ADMIN_URL: ${{ secrets.VILLANOVA_GHOST_ADMIN_URL }}
          VILLANOVA_GHOST_ADMIN_API_KEY: ${{ secrets.VILLANOVA_GHOST_ADMIN_API_KEY }}
        run: node site-villanova/scripts/fase1-corrigir-canonicas.mjs
