name: Portal — Capturar logs do Worker (tail ~150s)

# Abre uma janela de ~150s escutando os logs ao vivo do Worker ecobraz-portal.
# Serve para diagnosticar o login: enquanto roda, o Marcio refaz o pedido de link
# e o motivo (login_barrado / login_email_falhou / etc.) aparece aqui no log do job.
# NÃO grava segredos. Gatilho por push nesta branch (workflow_dispatch só vale após a main).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ecobraz-carbon-tracking-system-dh28dx
    paths:
      - '.github/workflows/portal-tail-logs.yml'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-cliente/worker
    steps:
      - uses: actions/checkout@v4
      - name: Escutar logs por ~150s
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "== Janela de captura aberta. Refaça o pedido de link agora. =="
          timeout 150 npx wrangler@latest tail ecobraz-portal --format pretty || true
          echo "== Janela de captura encerrada. =="
