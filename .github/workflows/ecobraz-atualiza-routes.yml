name: Ecobraz — atualizar routes.yaml no Ghost (remove rota órfã)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir routes.yaml corrigido para o Ghost
        env:
          BASE_URL: https://ecobraz.org
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/atualiza-routes.mjs
