name: "Ferramenta — coleta pública de avaliações do Google (perfil Ecobraz)"

# Abre o link público do perfil da Ecobraz no Google Maps num navegador real,
# rola a lista de avaliações e registra nome, estrelas, data relativa e texto
# de cada avaliação no resumo do job (e como artefato JSON).
# Só LEITURA de dados públicos — nada é alterado em lugar nenhum.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link público do perfil (share.google ou maps.app.goo.gl)"
        required: false
        default: "https://share.google/DrfOh7JDdkShOvcQy"

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Abrir o perfil e coletar as avaliações
        env:
          URL_PERFIL: ${{ inputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.URL_PERFIL || 'https://share.google/DrfOh7JDdkShOvcQy';
          const browser = await chromium.launch();
          const ctx = await browser.newContext({
            locale: 'pt-BR',
            viewport: { width: 1440, height: 900 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
          });
          const page = await ctx.newPage();
          const out = { url_inicial: url, url_final: '', nome: '', nota: '', total_avaliacoes: '', avaliacoes: [], avisos: [] };

          const aceitarConsentimento = async () => {
            for (const label of ['Aceitar tudo', 'Accept all', 'Aceitar todos', 'I agree', 'Concordo']) {
              const b = page.getByRole('button', { name: label });
              if (await b.count()) { await b.first().click().catch(() => {}); await page.waitForTimeout(2500); return true; }
            }
            return false;
          };
          const log = (...a) => console.log('[etapa]', ...a);

          try {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(4000);
            await aceitarConsentimento();
            log('após link compartilhado:', page.url(), '| título:', await page.title());

            // Se a página intermediária do share.google não levou ao Maps, segue o link para o Maps
            if (!page.url().includes('/maps/place')) {
              const aMaps = page.locator('a[href*="maps.google"], a[href*="google.com/maps"], a[href*="maps.app.goo.gl"]');
              if (await aMaps.count()) {
                const href = await aMaps.first().getAttribute('href');
                log('seguindo link para o Maps:', href);
                await page.goto(href, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => {});
                await page.waitForTimeout(4000);
                await aceitarConsentimento();
              }
            }

            // Último recurso: busca direta pela ficha (nome + bairro confirmados por print do perfil)
            if (!page.url().includes('/maps/place')) {
              log('busca direta no Maps como alternativa');
              await page.goto('https://www.google.com/maps/search/Ecobraz+Emigre+R.+Dona+Maria+Quedas+230+Sao+Paulo?hl=pt-BR', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(5000);
              await aceitarConsentimento();
              if (!page.url().includes('/maps/place')) {
                const primeira = page.locator('a[href*="/maps/place/"]').first();
                if (await primeira.count()) { await primeira.click().catch(() => {}); await page.waitForTimeout(4000); }
              }
            }
            log('página de trabalho:', page.url(), '| título:', await page.title());

            out.url_final = page.url();
            out.nome = (await page.locator('h1').first().textContent().catch(() => '') || '').trim();
            if (!out.nome) {
              const corpo = (await page.locator('body').innerText().catch(() => '') || '').slice(0, 600);
              out.avisos.push('h1 vazio; início do corpo da página: ' + corpo.replace(/\n+/g, ' | '));
            }

            // Nota e total (cabeçalho do perfil)
            const head = await page.locator('div.F7nice').first().textContent().catch(() => '');
            if (head) {
              const m = head.match(/(\d[.,]\d)/); if (m) out.nota = m[1];
              const t = head.match(/\(([\d.,]+)\)/); if (t) out.total_avaliacoes = t[1];
            }
            if (!out.nota) {
              const alt = await page.locator('span[aria-label*="estrela"]').first().getAttribute('aria-label').catch(() => '');
              if (alt) out.avisos.push('nota via aria-label: ' + alt);
            }

            // Abre a aba de avaliações
            const tab = page.getByRole('tab', { name: /Avalia|Review/i });
            if (await tab.count()) { await tab.first().click(); await page.waitForTimeout(2500); }
            else {
              const btn = page.locator('button[aria-label*="avalia"], button:has-text("avaliações")');
              if (await btn.count()) { await btn.first().click(); await page.waitForTimeout(2500); }
              else out.avisos.push('aba de avaliações não encontrada — coletando o que estiver visível');
            }

            // Rola o painel até estabilizar
            const feed = page.locator('div[role="main"] div.m6QErb.DxyBCb').last();
            let estavel = 0, anterior = 0;
            for (let i = 0; i < 60 && estavel < 5; i++) {
              await feed.evaluate((el) => el.scrollBy(0, 3000)).catch(() => {});
              await page.waitForTimeout(700);
              const n = await page.locator('div.jftiEf').count();
              if (n === anterior) estavel++; else { estavel = 0; anterior = n; }
            }

            // Expande textos truncados ("Mais")
            const mais = page.locator('button.w8nwRe');
            const nMais = await mais.count();
            for (let i = 0; i < nMais; i++) await mais.nth(i).click().catch(() => {});
            await page.waitForTimeout(800);

            // Coleta
            const cards = page.locator('div.jftiEf');
            const total = await cards.count();
            for (let i = 0; i < total; i++) {
              const c = cards.nth(i);
              const autor = (await c.locator('.d4r55').first().textContent().catch(() => '') || '').trim();
              const estrelas = (await c.locator('span[role="img"]').first().getAttribute('aria-label').catch(() => '') || '').trim();
              const quando = (await c.locator('.rsqaWe').first().textContent().catch(() => '') || '').trim();
              const texto = (await c.locator('.wiI7pd').first().textContent().catch(() => '') || '').trim();
              out.avaliacoes.push({ autor, estrelas, quando, texto });
            }
          } catch (err) {
            out.avisos.push('ERRO: ' + err.message);
          }

          await browser.close();
          fs.writeFileSync('avaliacoes-google.json', JSON.stringify(out, null, 2));
          // JSON completo nos logs (o ambiente de trabalho não consegue baixar artefatos)
          console.log('===JSON-COMPLETO-INICIO===');
          console.log(JSON.stringify(out));
          console.log('===JSON-COMPLETO-FIM===');

          const md = [
            '## Perfil: ' + (out.nome || '(nome não capturado)'),
            '- URL final: ' + out.url_final,
            '- Nota: **' + (out.nota || '?') + '** · Total de avaliações no perfil: **' + (out.total_avaliacoes || '?') + '** · Coletadas: **' + out.avaliacoes.length + '**',
            out.avisos.length ? '- Avisos: ' + out.avisos.join(' | ') : '',
            '',
            ...out.avaliacoes.map((a, i) => `**${i + 1}. ${a.autor}** — ${a.estrelas} — ${a.quando}\n\n> ${(a.texto || '(sem texto)').replace(/\n/g, ' ')}\n`),
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          NODE
      - name: Guardar JSON como artefato
        uses: actions/upload-artifact@v4
        with:
          name: avaliacoes-google
          path: avaliacoes-google.json
