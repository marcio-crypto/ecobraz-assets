name: Ecobraz — exportar conteúdo do Ghost

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exportar páginas e posts do Ghost
        env:
          GHOST_ADMIN_URL: ${{ secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        run: node site-ghost/scripts/export-conteudo.mjs
      - name: Publicar exportação no branch ecobraz-export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ecobraz-export
          git add -f site-ghost/export/
          git commit -m "Exportação de conteúdo do Ghost (ecobraz.org)"
          git push -f origin ecobraz-export
