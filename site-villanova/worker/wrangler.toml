name = "villanova-contato"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "0ab0573840927669f3bb3666d63cc023"

# Envio de e-mail nativo do Cloudflare (Email Routing). Requer Email Routing
# ativo em villanovaesg.com e o DEST_EMAIL verificado como destino.
send_email = [
  { name = "SEB" }
]

# Configuração (não são segredos — apenas endereços). Ajuste DEST_EMAIL para o
# inbox que deve receber os leads, se diferente.
[vars]
FROM_EMAIL = "contato@villanovaesg.com"
DEST_EMAIL = "contato@villanovaesg.com"
